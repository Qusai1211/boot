<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Payment Settings</title>
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Bootstrap Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

  <style>
    body {
      background: url('visacard1.jpg') no-repeat center center fixed;
      background-size: cover;
      min-height: 100vh;
    }
    .custom-card {
      max-width: 500px;
      border-radius: 12px;
      background-color: #ffffff;
    }
    .form-floating > label {
      font-size: 0.8rem;
      color: #8c8c8c;
    }
    .card-badge {
      width: 54px;
      height: 36px;
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .btn-add {
      background-color: #00b050;
      color: #ffffff;
      font-weight: 600;
      letter-spacing: 0.5px;
      border-radius: 6px;
    }
    .btn-add:hover {
      background-color: #009643;
      color: #ffffff;
    }
    .text-remove {
      color: #6c757d;
      font-size: 0.85rem;
      text-decoration: none;
      white-space: nowrap;
    }
    .text-remove:hover {
      color: #dc3545;
    }
  </style>
</head>
<body class="d-flex align-items-center justify-content-center py-5">

  <div class="card custom-card shadow border-0 w-100 p-4 p-md-5">
  
    <div class="text-center mb-4">
      <h3 class="fw-bold mb-1">Settings</h3>
      <p class="text-muted small mb-0">Payment</p>
    </div>

   
    <div class="mb-4">
      <h6 class="fw-bold small mb-3">Saved cards:</h6>

      
      <div class="d-flex align-items-center justify-content-between mb-3">
        <div class="card-badge bg-black text-white me-2">
          <i class="bi bi-circle-fill text-danger" style="font-size: 0.9rem; margin-right: -7px;"></i>
          <i class="bi bi-circle-fill text-warning opacity-75" style="font-size: 0.9rem;"></i>
        </div>
        <div class="form-floating flex-grow-1 me-3">
          <input type="text" class="form-control form-control-sm" id="mc" value="•••• •••• •••• 321" readonly>
          <label for="mc">Card Number</label>
        </div>
        <a href="#" class="text-remove">Remove card</a>
      </div>

      <div class="d-flex align-items-center justify-content-between">
        <div class="card-badge bg-black text-white fw-bold fst-italic me-2" style="font-size: 0.8rem;">
          VISA
        </div>
        <div class="form-floating flex-grow-1 me-3">
          <input type="text" class="form-control form-control-sm" id="visa" value="•••• •••• •••• 3333" readonly>
          <label for="visa">Card Number</label>
        </div>
        <a href="#" class="text-remove">Remove card</a>
      </div>
    </div>

    <div>
      <h6 class="fw-bold small mb-3">Add new card:</h6>
      <form>
        <div class="form-floating mb-3">
          <input type="text" class="form-control" id="holderName" placeholder="Cardholder's Name" value="قصي">
          <label for="holderName">Cardholder's Name</label>
        </div>

        <div class="row g-2 mb-4">
          <div class="col-6">
            <div class="form-floating">
              <input type="text" class="form-control" id="cardNum" placeholder=" 5678 888 5678" value=" 5678 888 5678">
              <label for="cardNum">Card Number</label>
            </div>
          </div>
          <div class="col-3">
            <div class="form-floating">
              <input type="text" class="form-control" id="expDate" placeholder="MM/YY" value="MM/YY">
              <label for="expDate">Expire</label>
            </div>
          </div>
          <div class="col-3">
            <div class="form-floating">
              <input type="password" class="form-control" id="cvv" placeholder="•••" value="•••">
              <label for="cvv">CVV</label>
            </div>
          </div>
        </div>

        <button type="submit" class="btn btn-add w-100 py-2 text-uppercase">
          ADD CARD
        </button>
      </form>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
